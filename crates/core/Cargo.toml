[package]
name = "makefmt"
version = "0.0.0"
edition = "2024"
description = "Makefile formatter"
license = "MIT"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = [
  "std",
  "parse",
  "serde",
] }

[dev-dependencies]
libtest-mimic = "0.8.2"

[[test]]
name = "makefile"
harness = false

[[test]]
name = "justfile"
harness = false
